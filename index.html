<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buffer Meli</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ==========================================================================
           BUFFER MELI - CSS CONSOLIDADO
           Padrão Visual: Mercado Livre (Dark Theme)
           ========================================================================== */
        :root {
            --ml-yellow: #FFF159;
            --ml-yellow-hover: #E6D84F;
            --ml-blue: #3483FA;
            --ml-blue-hover: #2968C8;
            --ml-green: #00A650;
            --ml-green-light: #10B981;
            --ml-red: #E74C3C;
            --ml-orange: #F59E0B;
            --ml-purple: #A855F7;

            --bg-primary: #0B0F17;
            --bg-secondary: #151B26;
            --bg-tertiary: #1E2532;
            --bg-input: #252D3D;
            --bg-hover: #2A3447;

            --border-color: #334155;
            --border-light: #475569;

            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --text-dark: #0F172A;

            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -4px rgba(0, 0, 0, 0.4);

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "Consolas", "Courier New", monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: var(--font-main);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; }

        /* NAVEGAÇÃO */
        .main-navbar {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-secondary);
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            position: sticky; top: 0; z-index: 1000; gap: 16px;
        }
        .nav-brand { font-size: 1.25rem; font-weight: 700; color: var(--ml-yellow); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        .nav-links { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .nav-btn {
            background-color: transparent; border: 1px solid transparent;
            color: var(--text-secondary); padding: 8px 14px;
            font-size: 0.875rem; font-weight: 600;
            border-radius: var(--radius-md); cursor: pointer;
            transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
        }
        .nav-btn:hover { color: var(--text-primary); background-color: var(--bg-tertiary); }
        .nav-btn.active { background-color: var(--ml-yellow); color: var(--text-dark); border-color: var(--ml-yellow); font-weight: 700; }

        /* PÁGINAS */
        .app-page { display: none; max-width: 1600px; margin: 0 auto; padding: 20px; animation: fadeIn 0.25s ease; }
        .app-page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .app-container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

        /* COMPONENTES COMUNS */
        .card, .card-box {
            background-color: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-md);
        }
        .card-box h2, .card h2 { font-size: 1.1rem; color: var(--ml-yellow); margin-bottom: 16px; font-weight: 600; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); background-color: rgba(0,0,0,0.15); margin: -20px -20px 20px -20px; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
        .card-header h2 { margin: 0; font-size: 1rem; }
        .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .card-header-flex h2 { margin: 0; }
        .page-header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-secondary); padding: 20px 24px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); flex-wrap: wrap; gap: 16px; }
        .header-title h1 { font-size: 1.5rem; font-weight: 700; color: var(--text-primary); }
        .header-title p { font-size: 0.875rem; color: var(--text-secondary); }
        .header-actions { display: flex; gap: 12px; flex-wrap: wrap; }

        /* BOTÕES */
        .btn { padding: 10px 18px; font-size: 0.875rem; font-weight: 600; border-radius: var(--radius-md); border: none; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background-color: var(--ml-blue); color: #fff; }
        .btn-primary:hover { background-color: var(--ml-blue-hover); }
        .btn-secondary { background-color: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border-light); }
        .btn-secondary:hover { background-color: var(--bg-hover); }
        .btn-danger { background-color: rgba(231,76,60,0.15); color: var(--ml-red); border: 1px solid rgba(231,76,60,0.4); }
        .btn-danger:hover { background-color: var(--ml-red); color: #fff; }
        .btn-filter { background-color: var(--ml-yellow); color: var(--text-dark); font-weight: 700; }
        .btn-filter:hover { background-color: var(--ml-yellow-hover); }
        .btn-action { background-color: transparent; border: 1px solid var(--border-light); color: var(--text-primary); padding: 8px 14px; border-radius: var(--radius-md); cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px; }
        .btn-action:hover { border-color: var(--ml-blue); color: var(--ml-blue); }
        .btn-action.primary { background-color: var(--ml-blue); border-color: var(--ml-blue); color: #fff; }
        .btn-action.primary:hover { background-color: var(--ml-blue-hover); }
        .btn-action.danger { border-color: var(--ml-red); color: #FCA5A5; }
        .btn-action.danger:hover { background-color: rgba(231,76,60,0.1); }
        .btn-action.warning { border-color: var(--ml-orange); color: #FCD34D; }
        .btn-action.warning:hover { background-color: rgba(245,158,11,0.1); }
        .btn-control { background-color: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border-light); width: 26px; height: 26px; border-radius: var(--radius-sm); font-weight: bold; font-size: 0.9rem; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; }
        .btn-control:hover { background-color: var(--bg-hover); border-color: var(--ml-yellow); color: var(--ml-yellow); }
        .btn-control.add:hover { background-color: rgba(0,166,80,0.2); border-color: var(--ml-green); color: var(--ml-green); }
        .btn-control.remove:hover { background-color: rgba(231,76,60,0.2); border-color: var(--ml-red); color: var(--ml-red); }
        .btn-page { background-color: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; transition: all 0.2s ease; }
        .btn-page.active { background-color: var(--ml-yellow); color: var(--text-dark); border-color: var(--ml-yellow); }
        .btn-page:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-table { background-color: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); padding: 4px 8px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.75rem; font-weight: 600; transition: all 0.2s ease; }
        .btn-table:hover { border-color: var(--ml-blue); color: var(--ml-blue); }

        input, select, textarea { background-color: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); padding: 10px 14px; border-radius: var(--radius-md); font-size: 0.875rem; outline: none; transition: all 0.2s ease; }
        input:focus, select:focus, textarea:focus { border-color: var(--ml-blue); box-shadow: 0 0 0 3px rgba(52,131,250,0.15); }

        .table-container { background-color: var(--bg-secondary); border-radius: var(--radius-lg); border: 1px solid var(--border-color); overflow-x: auto; }
        .table-responsive { width: 100%; overflow-x: auto; border-radius: var(--radius-md); }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
